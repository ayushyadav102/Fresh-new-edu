<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#grad1)" />
  
  <!-- School Cap & Crest Shape -->
  <g transform="translate(26, 26)" filter="url(#shadow)">
    <!-- Graduation Cap Roof -->
    <path d="M 70 20 L 130 50 L 70 80 L 10 50 Z" fill="#ffffff" />
    <path d="M 70 24 L 122 50 L 70 76 L 18 50 Z" fill="url(#goldGrad)" opacity="0.9" />
    
    <!-- Cap Base / Ribbon -->
    <path d="M 35 63 L 35 90 C 35 105 105 105 105 90 L 105 63 C 95 72 80 77 70 77 C 60 77 45 72 35 63 Z" fill="#ffffff" />
    
    <!-- Tassel -->
    <path d="M 125 52 L 132 80 L 134 95 L 128 95 L 130 80 Z" fill="#fbbf24" />
    <circle cx="131" cy="95" r="4" fill="#fbbf24" />
    
    <!-- Shield / Book Emblem Below -->
    <path d="M 45 110 L 70 122 L 95 110 L 95 128 C 95 138 70 144 70 144 C 70 144 45 138 45 128 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 52 115 L 70 124 L 88 115 L 88 126 C 88 133 70 138 70 138 C 70 138 52 133 52 126 Z" fill="url(#grad1)" />
  </g>
</svg>
